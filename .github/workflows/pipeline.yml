name: CI/CD Pipeline

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::561067234915:role/github-actions-deploy-role
  ECR_REGISTRY: 561067234915.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: flask-app
  SERVER_NAME: flask-app-server
  LOG_GROUP: /flask-app/app

jobs:
  lint-test:
    name: Lint and Test
    runs-on: ubuntu-24.04
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with flake8
        run: flake8 .

      - name: Test with pytest
        run: pytest -v

  build-scan:
    name: Build and Security Scan
    needs: lint-test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t flask-app:${{ github.sha }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: flask-app:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to AWS with OIDC
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Push image to ECR
        if: github.event_name == 'push'
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          docker tag "flask-app:${GITHUB_SHA}" "$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"

  deploy:
    name: Deploy to EC2 and Health Check
    needs: build-scan
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-ec2
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Log in to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find the server
        id: server
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${SERVER_NAME}" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "No running server named ${SERVER_NAME} found. Is it started?"
            exit 1
          fi
          PUBLIC_IP=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          echo "Server ${INSTANCE_ID} is at ${PUBLIC_IP}"
          echo "instance_id=${INSTANCE_ID}" >> "$GITHUB_OUTPUT"
          echo "public_ip=${PUBLIC_IP}" >> "$GITHUB_OUTPUT"

      - name: Deploy new image with SSM
        env:
          INSTANCE_ID: ${{ steps.server.outputs.instance_id }}
        run: |
          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          cat > deploy.json <<EOF
          {"commands": [
            "aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}",
            "docker pull ${IMAGE}",
            "docker rm -f flask-app || true",
            "docker run -d --name flask-app --restart unless-stopped -p 80:5000 --log-driver awslogs --log-opt awslogs-region=${AWS_REGION} --log-opt awslogs-group=${LOG_GROUP} --log-opt awslogs-stream=${GITHUB_SHA} -e APP_VERSION=${GITHUB_SHA} ${IMAGE}",
            "docker image prune -af"
          ]}
          EOF
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${GITHUB_SHA::7}" \
            --parameters file://deploy.json \
            --query "Command.CommandId" --output text)
          echo "Sent SSM command ${COMMAND_ID}"
          sleep 3
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "Status" --output text)
          echo "----- Output from the server -----"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "[StandardOutputContent, StandardErrorContent]" --output text
          echo "Deploy status: ${STATUS}"
          [ "$STATUS" = "Success" ]

      - name: Health check
        env:
          PUBLIC_IP: ${{ steps.server.outputs.public_ip }}
        run: |
          for attempt in $(seq 1 10); do
            if curl -fsS --max-time 5 "http://${PUBLIC_IP}/health" | grep -q "healthy"; then
              echo "Health check passed on attempt ${attempt}"
              if curl -fsS "http://${PUBLIC_IP}/" | grep -q "${GITHUB_SHA}"; then
                echo "Live version is ${GITHUB_SHA}"
                echo "App is live at http://${PUBLIC_IP}" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "App is healthy but is running the wrong version"
              exit 1
            fi
            echo "Not healthy yet (attempt ${attempt}/10), waiting 6 seconds..."
            sleep 6
          done
          echo "Health check failed after 10 attempts"
          exit 1
